[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "truecount-action"
version = "0.1.0"
description = "Truecount agents that run in your own GitHub Actions runner"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Standard library only: this runs inside customers' environments, next to
# their dependencies, and must not add any of its own.
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/truecount_action"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
